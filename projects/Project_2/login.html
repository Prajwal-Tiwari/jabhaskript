<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div class="header">
        <nav class="home">Home</nav>
        <nav class="contact">Contact Us</nav>
        <nav class="login">Login</nav>
        <nav class="other">Other</nav>
    </div>
    <div class="main">
        <h1>Login</h1>
        <form id="LoginForm">
    
            <p>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </p>
    
            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </p>
    
            <button type="submitbtn" id="submit">Log In</button>
        </form>
    
    </div>
    <div class="footer"></div>
    <script src="scriptl.js"></script>
</body>
</html>
