<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">

        <div class="container">

            <h2>GitHub Profile Finder</h2>

            <div class="search-box">
                <input type="text" id="message" placeholder="Enter GitHub username...">

                <button id="search">
                    Search
                </button>
            </div>

            <div class="image">
                <img id="avatar" src="" alt="Avatar">
            </div>

            <h1 id="name"></h1>

            <div class="info">

                <div class="card">
                    <h3>Followers</h3>
                    <span id="followers">0</span>
                </div>

                <div class="card">
                    <h3>Bio</h3>
                    <span id="bio">No bio available</span>
                </div>

            </div>

        </div>

    </div>
</body>
<script>
const message = document.querySelector('#message');
const btn = document.querySelector("button");

btn.addEventListener('click', (e)=>{
    btn.disabled = true;
    const user_name = message.value.trim();

    if (!user_name) {
        alert("Please enter a username.");
        return;
    }
    
    const reqURL = `https://api.github.com/users/${user_name}`;
    const xhr = new XMLHttpRequest();
    xhr.open('GET', reqURL);

    xhr.onreadystatechange = function(){

        console.log(xhr.readyState);

        if(xhr.readyState===4){
            if(xhr.status===200){
                const data = JSON.parse(this.responseText);
                document.getElementById("avatar").src = data.avatar_url;
                document.getElementById("avatar").style.display = "block";
                document.getElementById("name").textContent = data.name;
                document.getElementById("followers").textContent = data.followers;
                document.getElementById("bio").textContent = data.bio || "No bio available";
            }
            else{
                alert("Github user not found");
            }
            button.disabled = false;
        }
    }
    xhr.send();
    });
</script>
</html>
