<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPYter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🕵️ SPYter</h1>

        <h3>Enter your secret message</h3>

        <textarea id="message" rows="8" placeholder="Type your secret here..."></textarea>

        <div class="buttons">
            <button id="encrypt">Encrypt</button>
            <button id="cancel">Cancel Destruction</button>
        </div>

        <div class="info">
            <p>
                <strong>Status:</strong>
                <span id="status">Waiting...</span>
            </p>

            <p>
                <strong>Countdown:</strong>
                <span id="countdown">5</span>
            </p>
        </div>

    </div>

    <script src="script4.js">
        
    </script>

</body>

</html>
